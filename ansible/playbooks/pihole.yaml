- hosts: pihole
  become: true
  vars:
    pihole_webpassword: "{{ vault_pihole_webpassword }}"
    # Source of truth: docs/network-inventory.md. Keep the two in step.
    pihole_dns_records:
      - "192.168.0.254 dell.home.arpa"
      - "192.168.0.129 hp32.home.arpa"
      - "192.168.0.125 hp16.home.arpa"
      - "192.168.0.60 cp-1.home.arpa"
      - "192.168.0.60 k8s.home.arpa"
      - "192.168.0.61 worker-1.home.arpa"
      - "192.168.0.62 worker-2.home.arpa"
      - "192.168.0.63 worker-3.home.arpa"
      - "192.168.0.64 pihole.home.arpa"
      - "192.168.0.65 truenas.home.arpa"
      - "192.168.0.66 jellyfin.home.arpa"
      - "192.168.0.67 ollama.home.arpa"
      - "192.168.0.70 nextcloud.home.arpa"
      - "192.168.0.71 git.home.arpa"
      - "192.168.0.72 grafana.home.arpa"
      - "192.168.0.73 prometheus.home.arpa"
      - "192.168.0.90 kthw-jumpbox.home.arpa"
      - "192.168.0.91 kthw-server.home.arpa"
      - "192.168.0.92 kthw-node-0.home.arpa"
      - "192.168.0.93 kthw-node-1.home.arpa"
  tasks:
    - name: Install installer prerequisites
      apt:
        name: [curl, ca-certificates, iproute2, procps]
        state: present
        update_cache: true

    # Holds 127.0.0.53:53 and 127.0.0.54:53; FTL wants 0.0.0.0:53.
    - name: Stop systemd-resolved so FTL can own port 53
      systemd:
        name: systemd-resolved
        state: stopped
        enabled: false
        masked: true

    - name: Create the Pi-hole config directory
      file:
        path: /etc/pihole
        state: directory
        mode: "0755"

    - name: Has Pi-hole already been installed?
      stat:
        path: /etc/pihole/pihole.toml
      register: pihole_toml

    # The v6 installer migrates this into pihole.toml and then deletes it, so
    # the guard is the install itself — not the file, which never survives.
    - name: Pre-seed the unattended install answers
      when: not pihole_toml.stat.exists
      copy:
        dest: /etc/pihole/setupVars.conf
        mode: "0644"
        content: |
          PIHOLE_INTERFACE=eth0
          IPV4_ADDRESS=192.168.0.64/24
          PIHOLE_DNS_1=1.1.1.1
          PIHOLE_DNS_2=9.9.9.9
          QUERY_LOGGING=true
          INSTALL_WEB_SERVER=true
          INSTALL_WEB_INTERFACE=true
          LIGHTTPD_ENABLED=false
          BLOCKING_ENABLED=true

    - name: Install Pi-hole
      shell: curl -sSL https://install.pi-hole.net | bash /dev/stdin --unattended
      args:
        creates: /etc/pihole/pihole.toml

    # v6 ignores the WEBPASSWORD env var; this is the only way in.
    - name: Set the web interface password
      command: pihole setpassword "{{ pihole_webpassword }}"
      no_log: true
      when: not pihole_toml.stat.exists

    - name: Make sure FTL is running and enabled
      systemd:
        name: pihole-FTL
        state: started
        enabled: true

    # v6 dropped /etc/pihole/custom.list; local records live in pihole.toml.
    - name: Read the current local DNS records
      command: pihole-FTL --config dns.hosts
      register: pihole_current_hosts
      changed_when: false

    - name: Publish the home.arpa local DNS records
      command:
        argv:
          - pihole-FTL
          - --config
          - dns.hosts
          - "{{ pihole_dns_records | to_json }}"
      when: >-
        (pihole_current_hosts.stdout | trim)
        != ('[ ' ~ (pihole_dns_records | join(', ')) ~ ' ]')
      notify: Restart pihole-FTL

  handlers:
    # Not `pihole restartdns`. A gravity rebuild replaces gravity.db by rename;
    # a running FTL keeps the old inode, logs "no such table: main.gravity" on
    # every lookup, and silently stops blocking. Only a restart re-opens it.
    - name: Restart pihole-FTL
      systemd:
        name: pihole-FTL
        state: restarted
