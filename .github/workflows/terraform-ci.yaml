name: Terraform CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  checkov:
    runs-on: ubuntu-latest
    container: bridgecrew/checkov:latest
    steps:
      - uses: actions/checkout@v3

      - name: Checkov scan
        run: checkov -d terraform --framework terraform --output cli --output junitxml --output-file-path console,checkov-report.xml
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.xml

  terraform:
    runs-on: ubuntu-latest
    needs: checkov
    strategy:
      fail-fast: false
      matrix:
        directories:
          - terraform/dell
          - terraform/hp-sff/16gb
          - terraform/hp-sff/32gb/pihole
    
    defaults:
      run:
        working-directory: ${{ matrix.directories }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format and check
        run: terraform fmt -check

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan