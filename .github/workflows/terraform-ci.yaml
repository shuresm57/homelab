name: Terraform CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test with Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/dell
          framework: terraform
          soft_fail: true

  terraform:
    runs-on: ubuntu-latest
    needs: checkov
    strategy:
      fail-fast: false
      matrix:
        directories:
          - terraform/dell
          - terraform/hp-sff/16gb
          - terraform/hp-sff/32gb/pihole
    
    defaults:
      run:
        working-directory: ${{ matrix.directories }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Format and check
        run: terraform fmt -check

      - name: Init
        run: terraform init

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan