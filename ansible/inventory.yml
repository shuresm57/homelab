all:
  hosts:
    localhost:
      ansible_connection: local
      # Modules must run inside Homebrew's ansible venv, which is where PyYAML
      # and the kubernetes client live. Bare /opt/homebrew/bin/python3 has neither.
      ansible_python_interpreter: /opt/homebrew/opt/ansible/libexec/bin/python
  children:
    ollama:
      hosts:
        ollama-vm:
          ansible_host: 192.168.0.67
          ansible_user: ubuntu
    pihole:
      hosts:
        pihole-lxc:
          ansible_host: 192.168.0.64
          ansible_user: root
          # This LXC was provisioned with a different key than the Dell VMs.
          # See terraform/hosts/hp-sff-32gb/terraform.tfvars.
          ansible_ssh_private_key_file: ~/.ssh/vss-server-16gb
